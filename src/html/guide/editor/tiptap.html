<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Vanilla JS + Tiptap 에디터 가이드</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 text-gray-800">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
    <h2 class="text-xl font-bold mb-4">공지사항 작성 (Tiptap 에디터)</h2>
    
    <div id="editor-toolbar" class="flex gap-1 p-2 border border-b-0 border-gray-200 bg-gray-50 rounded-t-lg">
      <button id="btn-bold" class="px-3 py-1 bg-white border border-gray-300 rounded text-sm font-bold hover:bg-gray-100 transition-colors">B</button>
      <button id="btn-italic" class="px-3 py-1 bg-white border border-gray-300 rounded text-sm italic hover:bg-gray-100 transition-colors">I</button>
      <button id="btn-strike" class="px-3 py-1 bg-white border border-gray-300 rounded text-sm line-through hover:bg-gray-100 transition-colors">S</button>
      <div class="w-px h-6 bg-gray-300 mx-1 align-middle self-center"></div>
      <button id="btn-clear" class="px-3 py-1 bg-white border border-gray-300 rounded text-sm text-red-500 hover:bg-gray-100 transition-colors">초기화</button>
    </div>

    <div id="editor-content" class="w-full min-h-[300px] border border-gray-200 rounded-b-lg p-4 bg-white outline-none focus-within:border-indigo-500 focus-within:ring-1 focus-within:ring-indigo-500 transition-all prose max-w-none">
      </div>

    <div class="mt-4 flex justify-end">
      <button id="btn-save" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded shadow-sm text-sm transition-colors">
        본문 내용 저장
      </button>
    </div>
  </div>

  <script type="module">
    import { Editor } from 'https://esm.sh/@tiptap/core';
    import StarterKit from 'https://esm.sh/@tiptap/starter-kit';

    document.addEventListener('DOMContentLoaded', () => {
      
      // 1. Tiptap 에디터 인스턴스 초기화
      const editor = new Editor({
        element: document.getElementById('editor-content'), // 마운트 타겟
        extensions: [
          StarterKit, // 굵게, 기울임, 단락, 목록 등 기본 핵심 기능 패키지
        ],
        content: '<p>여기에 <strong>공지사항</strong> 내용을 입력하세요.</p>', // 초기 기본값
        
        // 에디터 포커싱 상태 변화 등 이벤트 바인딩 가능
        onUpdate({ editor }) {
          // 실시간 글자수 체크나 자동 저장 기능 구현 시 활용
        }
      });

      // 2. 외부 커스텀 툴바 버튼과 Tiptap 명령어(Command) 매핑 연동
      document.getElementById('btn-bold').addEventListener('click', () => {
        editor.chain().focus().toggleBold().run();
      });

      document.getElementById('btn-italic').addEventListener('click', () => {
        editor.chain().focus().toggleItalic().run();
      });

      document.getElementById('btn-strike').addEventListener('click', () => {
        editor.chain().focus().toggleStrike().run();
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        if(confirm('작성된 내용을 모두 지우시겠습니까?')) {
          editor.commands.clearContent();
        }
      });

      // 3. 최종 저장 버튼 클릭 시 HTML 데이터 가공 추출 및 전송
      document.getElementById('btn-save').addEventListener('click', () => {
        const htmlContent = editor.getHTML(); // HTML 스트링 변환
        const jsonContent = editor.getJSON(); // JSON 객체 데이터 변환

        console.log("✏️ 서버로 보낼 HTML 소스:\n", htmlContent);
        console.log("📦 가공용 JSON 객체:\n", jsonContent);
        
        alert("콘솔창에서 저장된 HTML 소스를 확인하세요!");
      });

    });
  </script>

  <style>
    /* Tiptap 인스턴스가 바인딩되면 내부에 .ProseMirror 라는 클래스를 가진 div가 자동 생성됩니다. */
    .ProseMirror {
      outline: none;
      height: 100%;
      min-height: 280px;
    }
    .ProseMirror p { margin-bottom: 0.5rem; }
    .ProseMirror ul { list-style-type: disc; padding-left: 1.5rem; }
    .ProseMirror ol { list-style-type: decimal; padding-left: 1.5rem; }
  </style>
</body>
</html>
